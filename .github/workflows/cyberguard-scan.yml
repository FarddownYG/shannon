name: CyberGuard Shannon Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL cible a scanner'
        required: true
        type: string
      scan_type:
        description: 'Type de scan (quick ou full)'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
      repo_name:
        description: 'Nom du repo/projet a auditer'
        required: true
        default: 'cyberguard'
        type: string
      target_repo_url:
        description: 'URL GitHub du repo cible (pour white-box)'
        required: true
        type: string

jobs:
  shannon-pentest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Shannon
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
          fi

      - name: Make shannon executable
        run: chmod +x ./shannon

      - name: Clone target repository
        run: |
          mkdir -p ./repos
          echo "Cloning ${{ inputs.target_repo_url }} into ./repos/${{ inputs.repo_name }}"
          git clone ${{ inputs.target_repo_url }} ./repos/${{ inputs.repo_name }}
          echo "=== Target repo contents ==="
          ls -la ./repos/${{ inputs.repo_name }}/ | head -20

      - name: Debug - Pre-scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Node: $(node --version)"
          echo "API key length: ${#ANTHROPIC_API_KEY} chars"
          echo "Target repo: ./repos/${{ inputs.repo_name }}"
          ls -la ./repos/
          echo "Command: ./shannon start URL=${{ inputs.target_url }} REPO=${{ inputs.repo_name }}"

      - name: Run Shannon Pentest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "64000"
        run: |
          echo "::group::Starting Shannon scan"
          echo "Target: ${{ inputs.target_url }}"
          echo "Repo: ${{ inputs.repo_name }}"
          echo "Type: ${{ inputs.scan_type }}"
          ./shannon start URL=${{ inputs.target_url }} REPO=${{ inputs.repo_name }}
          echo "::endgroup::"

          SCAN_DIR=$(ls -td audit-logs/*/ 2>/dev/null | head -1)
          if [ -z "$SCAN_DIR" ]; then
            echo "WARNING: No scan directory created yet"
            mkdir -p audit-logs
          fi

          MAX_WAIT=5400
          WAITED=0
          while [ $WAITED -lt $MAX_WAIT ]; do
            SCAN_DIR=$(ls -td audit-logs/*/ 2>/dev/null | head -1)
            if [ -f "$SCAN_DIR/deliverables/comprehensive_security_assessment_report.md" ]; then
              echo "Scan completed!"
              break
            fi
            sleep 30
            WAITED=$((WAITED + 30))
            echo "Waiting... ($WAITED/$MAX_WAIT s)"
          done

      - name: Debug - Post-scan
        if: always()
        run: |
          find audit-logs/ -type f 2>/dev/null | head -50 || echo "Empty"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shannon-report
          path: audit-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          SCAN_DIR=$(ls -td audit-logs/*/ 2>/dev/null | head -1)
          if [ -f "$SCAN_DIR/deliverables/comprehensive_security_assessment_report.md" ]; then
            echo "## Shannon Pentest Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "$SCAN_DIR/deliverables/comprehensive_security_assessment_report.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Scan did not produce a report" >> $GITHUB_STEP_SUMMARY
          fi
